# Docker's embedded DNS. Using a short TTL so nginx picks up a new API
# container IP after a recreate instead of caching the old address forever.
resolver 127.0.0.11 valid=10s ipv6=off;

# Symfony only trusts the X-Forwarded-* headers it is told to, so normalise the
# scheme here and let the framework read it from TRUSTED_PROXIES.
map $http_x_forwarded_proto $forwarded_https {
    default   '';
    https     'on';
}

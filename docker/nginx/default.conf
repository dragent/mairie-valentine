server {
    listen 80;
    server_name _;

    root /var/www/html/public;

    client_max_body_size 20m;

    # Symfony front controller: everything is routed through index.php.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php_upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_param HTTPS $forwarded_https if_not_empty;

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 60s;

        # Prevent URIs that point to a PHP file other than the front controller.
        internal;
    }

    # Any other .php file is off limits.
    location ~ \.php$ {
        return 404;
    }

    # Never expose the FPM status/ping endpoints publicly.
    location ~ ^/(status|ping)$ {
        return 404;
    }

    access_log /dev/stdout;
    error_log /dev/stderr;
}

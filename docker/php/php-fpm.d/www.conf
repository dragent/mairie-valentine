[www]
; Expose the FPM status and ping endpoints so Docker can health-check the pool.
ping.path = /ping
pm.status_path = /status

clear_env = no

; Send worker output to the container logs instead of a file.
catch_workers_output = yes
decorate_workers_output = no

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360">
  <filter id="grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="1.35" numOctaves="2" stitchTiles="stitch" seed="4" result="noise" />
    <feColorMatrix
      in="noise"
      type="matrix"
      result="light"
      values="0 0 0 0 0.62
              0 0 0 0 0.48
              0 0 0 0 0.32
              0.28 0.28 0.28 0 -0.32"
    />
    <feColorMatrix
      in="noise"
      type="matrix"
      result="dark"
      values="0 0 0 0 0.03
              0 0 0 0 0.025
              0 0 0 0 0.02
              -0.28 -0.28 -0.28 0 0.36"
    />
    <feMerge>
      <feMergeNode in="dark" />
      <feMergeNode in="light" />
    </feMerge>
  </filter>
  <rect width="100%" height="100%" filter="url(#grain)" />
</svg>

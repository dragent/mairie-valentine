security:
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: discordId

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        # The OAuth2 handshake needs a session to carry the `state` parameter.
        oauth:
            pattern: ^/auth/discord
            stateless: false
            provider: app_user_provider

        api:
            pattern: ^/
            stateless: true
            provider: app_user_provider
            jwt: ~
            entry_point: jwt

    access_control:
        - { path: ^/auth/discord, roles: PUBLIC_ACCESS }
        - { path: ^/health$, roles: PUBLIC_ACCESS }
        - { path: ^/api/(docs|contexts|\.well-known), roles: PUBLIC_ACCESS }
        - { path: ^/api$, roles: PUBLIC_ACCESS }
        - { path: ^/api/public, roles: PUBLIC_ACCESS }
        # A citizen holds ROLE_USER only. These rules run before the generic
        # /api rule, so a forged request cannot reach a decree or a promotion.
        - { path: ^/api/(users|promotions|decrees|guild-members), roles: ROLE_ELU }
        - { path: ^/api/(notes|appointments|municipal_events), roles: ROLE_SECRETAIRE }
        - { path: ^/api, roles: ROLE_USER }

    # The mayor and his deputy share ROLE_ELU. The deputy may recruit
    # secretaries; ROLE_MAIRE reserves naming deputies and ceding the seat.
    role_hierarchy:
        ROLE_SECRETAIRE: [ROLE_USER]
        ROLE_ELU: [ROLE_SECRETAIRE]
        ROLE_MAIRE: [ROLE_ELU]
        ROLE_ADMIN: [ROLE_MAIRE, ROLE_ALLOWED_TO_SWITCH]

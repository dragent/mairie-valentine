api_platform:
    title: Mairie de Valentine – API
    description: |
        API interne de la mairie de Valentine (serveur RedM).
        L'authentification se fait via Discord puis par jeton JWT (`Authorization: Bearer <token>`).
    version: 0.1.0
    defaults:
        stateless: true
        cache_headers:
            vary: ['Content-Type', 'Authorization', 'Origin']
    formats:
        jsonld: ['application/ld+json']
        json: ['application/json']
    patch_formats:
        json: ['application/merge-patch+json']
    docs_formats:
        jsonld: ['application/ld+json']
        jsonopenapi: ['application/vnd.openapi+json']
        html: ['text/html']

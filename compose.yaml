name: mairie-valentine

services:
  db:
    image: mysql:8.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-mairie_valentine}
      MYSQL_USER: ${DB_USER:-mairie}
      MYSQL_PASSWORD: ${DB_PASSWORD:-mairie}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  api:
    image: mairie-valentine/api:dev
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_SECRET: ${APP_SECRET:-change_me_in_env}
      APP_DEBUG: ${APP_DEBUG:-1}
      AUTO_MIGRATE: ${AUTO_MIGRATE:-1}
      DATABASE_URL: mysql://${DB_USER:-mairie}:${DB_PASSWORD:-mairie}@db:3306/${DB_NAME:-mairie_valentine}?serverVersion=8.4.0&charset=utf8mb4
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:-change_me_in_env}
      CORS_ALLOW_ORIGIN: ${CORS_ALLOW_ORIGIN:-^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$$}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      DEFAULT_URI: ${API_URL:-http://localhost:8080}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
      DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1,REMOTE_ADDR}
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
    volumes:
      - ./apps/api:/var/www/html:cached
      - api_var:/var/www/html/var
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/wait-for-api.sh"]
    command: ["nginx", "-g", "daemon off;"]
    ports:
      - "${API_PORT:-8080}:80"
    volumes:
      - ./apps/api/public:/var/www/html/public:ro
      - ./docker/nginx/upstream.conf:/etc/nginx/conf.d/00-upstream.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/wait-for-api.sh:/wait-for-api.sh:ro
    restart: unless-stopped

  web:
    image: mairie-valentine/web:dev
    build:
      context: .
      dockerfile: docker/web/Dockerfile
      target: dev
    depends_on:
      - nginx
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      # Browser-side calls go through the host port, server-side ones stay internal.
      NEXT_PUBLIC_API_URL: ${API_URL:-http://localhost:8080}
      INTERNAL_API_URL: http://nginx
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app:cached
      - web_node_modules:/app/node_modules
      - web_next_cache:/app/.next
    restart: unless-stopped

  adminer:
    image: adminer:5
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: dracula
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    restart: unless-stopped

volumes:
  db_data:
  api_var:
  web_node_modules:
  web_next_cache:
